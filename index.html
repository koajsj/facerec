<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>人脸追踪</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-theme="dark">
    <div class="bg-grid"></div>
    <main class="layout">
      <section class="camera-wrap panel">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="debugOverlay" class="debug-overlay hidden"></div>
      </section>

      <aside class="panel side">
        <h1>人脸追踪</h1>
        <p class="sub">本地识别 · 实时跟随</p>

        <div class="toolbar">
          <button id="toggleBtn" class="btn-primary">开始</button>
          <button id="modelBtn">模式：检测器</button>
          <button id="toolsBtn">工具</button>
        </div>

        <details class="tools" id="toolsPanel">
          <summary>工具面板</summary>
          <div class="actions compact">
            <button id="shotBtn" disabled>截图</button>
            <button id="themeBtn">主题</button>
          </div>
        </details>

        <p class="state"><span>状态</span><strong id="statusText">待机</strong></p>
        <p class="state"><span>指标</span><strong id="metricsText">等待开始</strong></p>
        <p class="state"><span>质量</span><strong id="qualityText">等待中</strong></p>
        <p class="state"><span>事件</span><strong id="eventText">无</strong></p>
      </aside>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
