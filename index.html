<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1ea" />
    <title>人脸追踪</title>
    <link rel="stylesheet" href="./styles.css?v=20260524-1" />
  </head>
  <body>
    <main class="app-shell">
      <section class="stage-card">
        <div class="stage-top">
          <div>
            <p class="eyebrow">本地实时识别</p>
            <h1>人脸追踪</h1>
          </div>
          <strong id="statusPill" class="status-pill idle" aria-live="polite">待机</strong>
        </div>

        <div class="camera-wrap" id="cameraWrap">
          <video id="video" playsinline muted></video>
          <canvas id="overlay"></canvas>
          <div class="camera-empty" id="cameraEmpty">
            <strong id="cameraEmptyTitle">摄像头未启动</strong>
            <span id="cameraEmptyText">点击开始后在本机完成识别，不上传画面。</span>
          </div>
        </div>

        <div class="control-row">
          <button id="toggleBtn" class="btn primary" type="button">开始</button>
          <button id="modeBtn" class="btn" type="button">均衡</button>
          <details class="tools">
            <summary>工具</summary>
            <label>检测灵敏度 <input id="confidenceRange" type="range" min="30" max="75" value="42" /></label>
            <label>跟随速度 <input id="followRange" type="range" min="45" max="92" value="78" /></label>
            <label class="check"><input id="mirrorToggle" type="checkbox" checked /> 镜像预览</label>
          </details>
        </div>
      </section>

      <aside class="info-card">
        <div class="info-head">
          <p class="eyebrow">状态面板</p>
          <h2>识别质量</h2>
        </div>
        <div class="metric-grid">
          <div class="metric"><span>状态</span><strong id="statusText">待机</strong></div>
          <div class="metric"><span>置信度</span><strong id="metricsText">等待开始</strong></div>
          <div class="metric"><span>质量</span><strong id="qualityText">等待中</strong></div>
          <div class="metric"><span>事件</span><strong id="eventText">无</strong></div>
        </div>
        <p class="hint" id="hintText" aria-live="polite">保持脸部在画面中央，光线稳定时识别框会更稳。</p>
      </aside>
    </main>
    <script type="module" src="./app.js?v=20260524-1"></script>
  </body>
</html>
